<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seoto{% endblock %}</title>
    <style>
        /* Brand: the admin's brown as the structural tone, the logo's gold as the accent.
           Every pair below clears WCAG AA (4.5:1). */

        /* Reset styles */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }

        /* Main container */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        /* Header */
        .email-header {
            background: linear-gradient(135deg, #5d4037 0%, #3e2723 100%);
            padding: 30px 20px;
            text-align: center;
        }

        .email-header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Locked up beside the wordmark in the footer; the mark is gold on transparent. */
        .email-logo {
            display: block;
            width: 34px;
            height: auto;
            border: 0;
        }

        /* Content */
        .email-content {
            padding: 40px 30px;
            color: #3a3230;
        }

        .email-content h2 {
            color: #5d4037;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .email-content h3 {
            color: #5d4037;
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .email-content p {
            margin: 15px 0;
            color: #3a3230;
            font-size: 16px;
        }

        .email-content a {
            color: #5d4037;
            text-decoration: none;
        }

        .email-content a:hover {
            color: #3e2723;
            text-decoration: underline;
        }

        /* Button styles */
        .button {
            display: inline-block;
            padding: 14px 30px;
            margin: 20px 0;
            background-color: #5d4037;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
        }

        .button:hover {
            background-color: #6d4c41;
        }

        .button-warning {
            background-color: #8f6b23;
        }

        .button-warning:hover {
            background-color: #725419;
        }

        /* Highlight box */
        .highlight-box {
            background-color: #f5f0ec;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .accent-box {
            background-color: #fdf6e6;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        /* Footer — deeper than the header so the mail is bookended, not banded.
           Kept to two rows: a logo/wordmark lockup, then one line of fine print. It is
           the least important thing in the mail and should not out-weigh the content. */
        .email-footer {
            background-color: #3e2723;
            padding: 22px 20px;
            text-align: center;
            color: #ffffff;
        }

        .email-footer p {
            margin: 5px 0;
            font-size: 14px;
            color: #e8ded8;
        }

        .email-wordmark {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: .5px;
        }

        .email-fineprint {
            margin: 10px 0 0 0 !important;
            font-size: 12px;
            color: #bfa89c !important;
        }

        .email-footer a {
            color: #d0a23e;
            text-decoration: none;
        }

        .email-footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Divider */
        .divider {
            height: 1px;
            background-color: #e8ded8;
            margin: 30px 0;
        }

        /* Responsive */
        @media only screen and (max-width: 600px) {
            .email-content {
                padding: 30px 20px;
            }

            .email-header h1 {
                font-size: 24px;
            }

            .email-content h2 {
                font-size: 20px;
            }

            .button {
                display: block;
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <table class="email-container" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0">
                    <!-- Header -->
                    <tr>
                        <td class="email-header">
                            <h1>{% block header %}Seoto{% endblock %}</h1>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="email-content">
                            {% block content %}
                            <!-- Email content goes here -->
                            {% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="email-footer">
                            {% block footer %}
                            {# A centred table, not inline-block: Outlook ignores the latter. #}
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
                                <tr>
                                    {% if logo_cid %}
                                        <td style="padding-right: 10px; line-height: 0;">
                                            <a href="{{ app_domain }}"><img src="cid:{{ logo_cid }}" alt="Seoto" width="34" class="email-logo"></a>
                                        </td>
                                    {% endif %}
                                    <td class="email-wordmark">
                                        <a href="{{ app_domain }}" style="color: #ffffff;">Seoto</a>
                                    </td>
                                </tr>
                            </table>
                            <p class="email-fineprint">
                                Sent automatically — please don't reply.
                            </p>
                            {% endblock %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
