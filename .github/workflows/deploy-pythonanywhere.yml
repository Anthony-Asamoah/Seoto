name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_PROJECT_PATH: ${{ secrets.PYTHONANYWHERE_PROJECT_PATH }}
        run: |
          set -euo pipefail

          PROJECT_PATH="${PA_PROJECT_PATH:-~/seoto.org}"

          echo "🚀 Deploying to PythonAnywhere ($PA_USERNAME) ..."

          # Run the deploy remotely. Output streams back live and the remote
          # exit code propagates, so any failure (set -e) fails this job.
          ssh "${PA_USERNAME}@ssh.pythonanywhere.com" \
            "PROJECT_PATH='${PROJECT_PATH}' bash -l" <<'REMOTE'
          set -e
          eval cd "$PROJECT_PATH"
          git checkout master
          git pull --ff-only
          # uv installs to ~/.local/bin, which a non-interactive shell may miss.
          export PATH="$HOME/.local/bin:$PATH"
          # --frozen installs exactly what uv.lock pins and never re-resolves.
          uv sync --frozen --no-dev
          # manage.py lives in src/, which is also the import root.
          cd src
          uv run --no-sync python manage.py migrate --noinput
          uv run --no-sync python manage.py collectstatic --noinput
          echo DEPLOYMENT_SUCCESS
          REMOTE

      - name: Reload web application
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          set -euo pipefail
          HOST="${APP_DOMAIN:-seoto.org}"
          # Touch the WSGI file to reload the webapp. This avoids the reload
          # API's CNAME validation (it returns 409 cname_error for custom/apex
          # domains) and needs no API token. PythonAnywhere names the file
          # /var/www/<domain-with-dots-and-hyphens-as-underscores>_wsgi.py
          WSGI="/var/www/$(echo "$HOST" | tr '.-' '__')_wsgi.py"

          echo "🔄 Reloading web application by touching $WSGI ..."
          ssh "${PA_USERNAME}@ssh.pythonanywhere.com" \
            "if [ -f '$WSGI' ]; then touch '$WSGI'; else echo 'WSGI file not found: $WSGI'; exit 1; fi"
          echo "✅ Reload triggered"

      - name: Wait for deployment to settle
        run: sleep 10

      - name: Health check
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          HOST="${APP_DOMAIN:-seoto.org}"
          echo "🏥 Running health check on https://$HOST"

          # Try to fetch the homepage. Send a browser-like User-Agent and
          # follow redirects: PythonAnywhere's edge proxy returns 403 to
          # automated clients (e.g. the default curl/x.y UA), even though the
          # homepage is public and serves 200 to real browsers.
          HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 \
            -A "Mozilla/5.0 (compatible; SeotoHealthCheck/1.0)" \
            "https://$HOST" || echo "000")

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
            echo "🌐 Application is responding at https://$HOST"
          else
            echo "⚠️  Warning: Health check returned HTTP $HTTP_CODE"
            echo "The deployment may still be successful. Check PythonAnywhere logs if needed."
            # Don't fail the workflow on health check issues
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "====================="
          echo "Branch: master"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
