name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_PROJECT_PATH: ${{ secrets.PYTHONANYWHERE_PROJECT_PATH }}
        run: |
          set -euo pipefail

          PROJECT_PATH="${PA_PROJECT_PATH:-~/seoto.org}"

          echo "🚀 Deploying to PythonAnywhere ($PA_USERNAME) ..."

          # Run the deploy remotely. Output streams back live and the remote
          # exit code propagates, so any failure (set -e) fails this job.
          ssh "${PA_USERNAME}@ssh.pythonanywhere.com" \
            "PROJECT_PATH='${PROJECT_PATH}' bash -l" <<'REMOTE'
          set -e
          eval cd "$PROJECT_PATH"
          git checkout master
          git pull --ff-only
          # uv installs to ~/.local/bin, which a non-interactive shell may miss.
          export PATH="$HOME/.local/bin:$PATH"
          # --frozen installs exactly what uv.lock pins and never re-resolves.
          # only-system: fail loudly if the interpreter is missing rather than
          # downloading a 33MB one into a quota-limited home directory.
          # --no-progress: PythonAnywhere closes sessions that print too much.
          uv sync --frozen --no-dev --python-preference only-system --no-progress
          # Keep the wheel cache from growing against the disk quota.
          uv cache prune --ci --no-progress
          # manage.py lives in src/, which is also the import root.
          cd src
          uv run --no-sync python manage.py migrate --noinput
          uv run --no-sync python manage.py collectstatic --noinput
          echo DEPLOYMENT_SUCCESS
          REMOTE

      - name: Reload web application
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          set -euo pipefail
          HOST="${APP_DOMAIN:-apps.seoto.org}"
          # Touch the WSGI file to reload the webapp. This avoids the reload
          # API's CNAME validation (it returns 409 cname_error for custom/apex
          # domains) and needs no API token. PythonAnywhere names the file
          # /var/www/<domain-with-dots-and-hyphens-as-underscores>_wsgi.py
          WSGI="/var/www/$(echo "$HOST" | tr '.-' '__')_wsgi.py"

          echo "🔄 Reloading web application by touching $WSGI ..."
          ssh "${PA_USERNAME}@ssh.pythonanywhere.com" \
            "if [ -f '$WSGI' ]; then touch '$WSGI'; else echo 'WSGI file not found: $WSGI'; exit 1; fi"
          echo "✅ Reload triggered"

      - name: Health check
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          set -uo pipefail
          HOST="${APP_DOMAIN:-apps.seoto.org}"
          echo "🏥 Running health check on https://$HOST"

          # Retry rather than probing once: the worker is cold straight after a
          # reload, so a single early request can fail a healthy deploy.
          HTTP_CODE=000
          for attempt in 1 2 3 4 5; do
            sleep 10
            # Send a browser-like User-Agent and follow redirects: PythonAnywhere's
            # edge proxy returns 403 to automated clients (e.g. the default curl/x.y
            # UA), even though the homepage is public and serves 200 to real browsers.
            HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 \
              -A "Mozilla/5.0 (compatible; SeotoHealthCheck/1.0)" \
              "https://$HOST" || echo "000")

            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
              echo "✅ Health check passed on attempt $attempt (HTTP $HTTP_CODE)"
              echo "🌐 Application is responding at https://$HOST"
              exit 0
            fi
            echo "  attempt $attempt: HTTP $HTTP_CODE"
          done

          # A deploy that leaves the site broken must fail the job — otherwise a
          # 500 from a missing dependency looks identical to a good deploy.
          echo "❌ Health check failed after 5 attempts (last: HTTP $HTTP_CODE)"
          echo "The site is not serving. Check the PythonAnywhere error log."
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "====================="
          echo "Branch: master"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
