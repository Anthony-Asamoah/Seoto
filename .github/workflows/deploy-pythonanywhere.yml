name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko
          pip install httpx

      - name: Deploy to PythonAnywhere
        env:
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_PASSWORD: ${{ secrets.PYTHONANYWHERE_PASSWORD }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          python - <<'PYTHON_SCRIPT'
          import sys, os
          import paramiko
          import httpx

          # Get environment variables
          host = os.environ.get('APP_DOMAIN')
          username = os.environ.get('PYTHONANYWHERE_USERNAME')
          password = os.environ.get('PYTHONANYWHERE_PASSWORD')
          api_token = os.environ.get('PYTHONANYWHERE_API_TOKEN')
          directory = f'{username}.pythonanywhere.com'
          
          if not username or not password or not api_token:
              print("Error: PYTHONANYWHERE_USERNAME, PYTHONANYWHERE_PASSWORD, and PYTHONANYWHERE_API_TOKEN must be set")
              sys.exit(1)

          webapp_api_url = f'https://www.pythonanywhere.com/api/v0/user/{username}/webapps/{host}/reload/'
          headers = {
              'Authorization': f'Token {api_token}',
              'Content-Type': 'application/json'
          }

          print("=" * 60)
          print("Starting PythonAnywhere Deployment")
          print("=" * 60)

          # Deployment commands to run on PythonAnywhere via SSH
          deployment_commands = (
              f"set -e\n"
              f"cd {directory}\n"
              f'echo "Pulling latest code from GitHub..."\n'
              f"git checkout master\n"
              f"git pull\n"
              f'echo "Code updated successfully"\n'
              f'echo "Activating virtual environment..."\n'
              f"source ~/.virtualenvs/{directory}/bin/activate\n"
              f'echo "Virtual environment activated"\n'
              f'echo "Installing dependencies..."\n'
              f"pip install -r requirements.txt\n"
              f'echo "Dependencies installed"\n'
              f'echo "Running database migrations..."\n'
              f"python manage.py migrate --noinput\n"
              f'echo "Migrations completed"\n'
              f'echo "Collecting static files..."\n'
              f"python manage.py collectstatic --noinput --clear\n"
              f'echo "Static files collected"\n'
              f'echo "DEPLOYMENT_SUCCESS"\n'
          )

          try:
              # Connect via SSH
              print("\n🔌 Connecting to PythonAnywhere via SSH...")
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  'ssh.pythonanywhere.com',
                  username=username,
                  password=password,
                  timeout=30,
              )
              print("✅ SSH connection established")

              # Run deployment commands
              print("\n🚀 Running deployment commands...\n")
              print("=" * 60)
              stdin, stdout, stderr = ssh.exec_command(deployment_commands, get_pty=True)

              # Stream output as it arrives
              for line in stdout:
                  print(line, end='')

              exit_code = stdout.channel.recv_exit_status()
              err_output = stderr.read().decode()
              if err_output.strip():
                  print(f"\nSTDERR:\n{err_output}")
              print("=" * 60)

              ssh.close()

              if exit_code != 0:
                  raise Exception(f"Deployment commands failed with exit code {exit_code}")

              # Reload the web app via API
              print("\n🔄 Reloading web application...")
              reload_response = httpx.post(webapp_api_url, headers=headers, timeout=60)
              print(f"   Reload response ({reload_response.status_code}): {reload_response.text}")
              if 300 > reload_response.status_code >= 200:
                  print("✅ Web application reloaded successfully")
              else:
                  raise Exception(f"Reload failed with status {reload_response.status_code}")

              print("\n" + "=" * 60)
              print("🎉 Deployment completed successfully!")
              print(f"🌐 Your app should be live at: https://{host}")
              print("=" * 60)

          except Exception as e:
              print(f"\n❌ Deployment failed: {str(e)}")
              sys.exit(1)

          PYTHON_SCRIPT

      - name: Wait for deployment to settle
        run: sleep 10

      - name: Health check
        env:
          PYTHONANYWHERE_HOST: ${{ secrets.PYTHONANYWHERE_HOST }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          HOST="${APP_DOMAIN:-seoto.org}"
          echo "🏥 Running health check on https://$HOST"

          # Try to fetch the homepage
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://$HOST" || echo "000")

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
            echo "🌐 Application is responding at https://$HOST"
          else
            echo "⚠️  Warning: Health check returned HTTP $HTTP_CODE"
            echo "The deployment may still be successful. Check PythonAnywhere logs if needed."
            # Don't fail the workflow on health check issues
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "====================="
          echo "Branch: master"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
