{% url 'pwa:notifications_list' as notif_url %}
{% url 'pwa:mark_notifications_read' as notif_read_url %}
{% url 'weather_forecast' as weather_url %}

<!-- Weather dropdown panel (available to all visitors, authenticated or not) -->
<div id="weather-overlay" class="notif-overlay" aria-hidden="true"></div>
<div id="weather-panel" class="notif-panel" role="dialog" aria-label="Weather" aria-hidden="true">
    <div class="notif-panel-header">
        <span class="notif-panel-title">Weather</span>
        <div class="notif-panel-actions">
            <button type="button" class="notif-push-toggle" id="weather-locate-btn">
                <i class="fas fa-location-crosshairs" aria-hidden="true"></i>
                <span>Use my location</span>
            </button>
            <button class="notif-panel-close" id="weather-close" aria-label="Close weather">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div class="weather-body" id="weather-body">
        <div class="notif-loading">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</div>

<!-- Notification dropdown panel (slides up from above the nav) -->
{% if user.is_authenticated %}
<div id="notif-overlay" class="notif-overlay" aria-hidden="true"></div>
<div id="notif-panel" class="notif-panel" role="dialog" aria-label="Notifications" aria-hidden="true">
    <div class="notif-panel-header">
        <span class="notif-panel-title">Notifications</span>
        <div class="notif-panel-actions">
            <button type="button" class="notif-push-toggle" id="notif-push-toggle" hidden>
                <i class="far fa-bell" aria-hidden="true"></i>
                <span class="notif-push-label">Enable push</span>
            </button>
            <button class="notif-panel-close" id="notif-close" aria-label="Close notifications">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div class="notif-list" id="notif-list">
        <div class="notif-loading">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</div>
{% endif %}

<nav class="bottom-nav" aria-label="Mobile navigation">

    {% if user.is_authenticated %}

        <a href="{% url 'profile' user.username %}"
           class="bottom-nav-item{% if request.resolver_match.url_name == 'profile' %} active{% endif %}"
           aria-current="{% if request.resolver_match.url_name == 'profile' %}page{% else %}false{% endif %}">
            <i class="fas fa-user" aria-hidden="true"></i>
            <span>Profile</span>
        </a>

        <button class="bottom-nav-item" id="notif-toggle"
                aria-label="Notifications" aria-expanded="false" aria-controls="notif-panel">
            <span class="notif-bell-wrap">
                <i class="fas fa-bell" aria-hidden="true"></i>
                <span class="notif-badge" id="notif-badge" style="display:none;"></span>
            </span>
            <span>Alerts</span>
        </button>

    {% else %}

        <a href="{% url 'login' %}"
           class="bottom-nav-item{% if request.resolver_match.url_name == 'login' %} active{% endif %}"
           aria-current="{% if request.resolver_match.url_name == 'login' %}page{% else %}false{% endif %}">
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
            <span>Login</span>
        </a>

        <a href="{% url 'register' %}"
           class="bottom-nav-item{% if request.resolver_match.url_name == 'register' %} active{% endif %}"
           aria-current="{% if request.resolver_match.url_name == 'register' %}page{% else %}false{% endif %}">
            <i class="fas fa-user-plus" aria-hidden="true"></i>
            <span>Sign up</span>
        </a>

    {% endif %}

    <a href="{% url 'apps' %}"
       class="bottom-nav-item{% if request.resolver_match.url_name == 'apps' %} active{% endif %}"
       aria-current="{% if request.resolver_match.url_name == 'apps' %}page{% else %}false{% endif %}">
        <i class="fas fa-home" aria-hidden="true"></i>
        <span>Home</span>
    </a>

    <button class="bottom-nav-item" id="weather-toggle-mobile"
            aria-label="Weather" aria-expanded="false" aria-controls="weather-panel">
        <i class="fas fa-cloud-sun" aria-hidden="true"></i>
        <span>Weather</span>
    </button>

    <div class="nav-divider" aria-hidden="true"></div>

    <button class="bottom-nav-back" id="bottom-nav-back"
            onclick="history.back()"
            aria-label="Go back"
            title="Go back">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        <span>Back</span>
    </button>

</nav>

<script>
(function () {
    var NOTIF_URL  = '{{ notif_url }}';
    var READ_URL   = '{{ notif_read_url }}';

    function getCsrf() {
        var match = document.cookie.match(/csrftoken=([^;]+)/);
        return match ? match[1] : '';
    }

    function timeAgo(iso) {
        var diff = (Date.now() - new Date(iso)) / 1000;
        if (diff < 60)     return 'just now';
        if (diff < 3600)   return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400)  return Math.floor(diff / 3600) + 'h ago';
        if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
        return new Date(iso).toLocaleDateString();
    }

    function setBadge(count) {
        var badge = document.getElementById('notif-badge');
        if (!badge) return;
        if (count > 0) {
            badge.textContent = count > 9 ? '9+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

    function renderNotifications(items) {
        var list = document.getElementById('notif-list');
        if (!list) return;
        if (!items || !items.length) {
            list.innerHTML = '<div class="notif-empty"><i class="fas fa-bell-slash"></i><span>No notifications yet</span></div>';
            return;
        }
        list.innerHTML = items.map(function (n) {
            var cls = n.is_read ? 'notif-item' : 'notif-item unread';
            var url = n.url ? ' data-url="' + n.url + '"' : '';
            return '<div class="' + cls + '"' + url + '>'
                + '<div class="notif-item-title">' + n.title + '</div>'
                + '<div class="notif-item-body">' + n.body + '</div>'
                + '<div class="notif-item-time">' + timeAgo(n.created_at) + '</div>'
                + '</div>';
        }).join('');

        list.querySelectorAll('.notif-item[data-url]').forEach(function (el) {
            el.addEventListener('click', function () {
                window.location.href = el.dataset.url;
            });
        });
    }

    function openPanel() {
        var panel   = document.getElementById('notif-panel');
        var overlay = document.getElementById('notif-overlay');
        if (!panel) return;

        if (window.SeotoCloseWeatherPanel) window.SeotoCloseWeatherPanel();

        panel.classList.add('open');
        panel.setAttribute('aria-hidden', 'false');
        overlay.classList.add('active');
        ['notif-toggle', 'notification-toggle'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('aria-expanded', 'true');
        });

        // Fetch notifications
        fetch(NOTIF_URL, { credentials: 'same-origin' })
            .then(function (r) {
                if (!r.ok) {
                    console.error('[Seoto] Notifications API returned HTTP ' + r.status + ' — check server logs or run migrations');
                    throw new Error('HTTP ' + r.status);
                }
                return r.json();
            })
            .then(function (data) {
                renderNotifications(data.notifications);
                setBadge(0); // clear badge once panel is open

                // Mark all as read
                fetch(READ_URL, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'X-CSRFToken': getCsrf() },
                })
                .catch(function () {});
            })
            .catch(function (err) {
                console.error('[Seoto] Notifications fetch failed:', err && err.message);
                var list = document.getElementById('notif-list');
                if (list) list.innerHTML = '<div class="notif-empty"><i class="fas fa-exclamation-circle"></i><span>Could not load notifications</span></div>';
            });
    }

    function closePanel() {
        var panel   = document.getElementById('notif-panel');
        var overlay = document.getElementById('notif-overlay');
        if (!panel) return;
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('active');
        ['notif-toggle', 'notification-toggle'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('aria-expanded', 'false');
        });
    }

    window.SeotoCloseNotifPanel = closePanel;

    document.addEventListener('DOMContentLoaded', function () {
        // Hide back button when there is nowhere to go back to
        var backBtn = document.getElementById('bottom-nav-back');
        if (backBtn && window.history.length <= 1) {
            backBtn.style.visibility = 'hidden';
        }

        // Fetch unread count on load to populate badge
        {% if user.is_authenticated %}
        fetch(NOTIF_URL, { credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (data) { setBadge(data.unread_count); })
            .catch(function () {});
        {% endif %}

        // Bell toggle — wired for both bottom nav (mobile) and top nav (desktop)
        ['notif-toggle', 'notification-toggle'].forEach(function (id) {
            var toggle = document.getElementById(id);
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var panel = document.getElementById('notif-panel');
                    if (panel && panel.classList.contains('open')) {
                        closePanel();
                    } else {
                        openPanel();
                    }
                });
            }
        });

        // Close button & overlay
        var closeBtn = document.getElementById('notif-close');
        var overlay  = document.getElementById('notif-overlay');
        if (closeBtn) closeBtn.addEventListener('click', closePanel);
        if (overlay)  overlay.addEventListener('click', closePanel);

        // Haptic + visual tap feedback on every nav control
        document.querySelectorAll('.bottom-nav-item, .bottom-nav-back').forEach(function (el) {
            el.addEventListener('pointerdown', function () {
                if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
                el.classList.add('nav-tap');
                el.addEventListener('animationend', function handler() {
                    el.classList.remove('nav-tap');
                    el.removeEventListener('animationend', handler);
                });
            });
        });
    });
})();
</script>

<script>
(function () {
    var FORECAST_URL = '{{ weather_url }}';
    var lastPayload = null; // avoid refetching every time the panel is reopened

    function formatTemp(value) {
        if (value === null || value === undefined) return '--';
        return Math.round(value) + '°C';
    }

    function placeName(payload) {
        var loc = payload.location || {};
        return [loc.city, loc.region, loc.country].filter(Boolean).join(', ')
            || (payload.source === 'gps' ? 'Your current location' : 'Your area');
    }

    function renderDaily(days) {
        if (!days || !days.length) return '';
        return '<div class="weather-daily">' + days.map(function (d) {
            return '<div class="weather-day">' +
                '<div class="weather-day-label">' + d.day_label + '</div>' +
                '<i class="fas ' + d.icon + '" aria-hidden="true"></i>' +
                '<div class="weather-day-temps"><span>' + formatTemp(d.high) + '</span><span class="weather-day-low">' + formatTemp(d.low) + '</span></div>' +
            '</div>';
        }).join('') + '</div>';
    }

    function renderWeather(payload) {
        var body = document.getElementById('weather-body');
        if (!body) return;
        var w = payload.weather;

        body.innerHTML =
            '<div class="weather-current">' +
                '<i class="fas ' + w.icon + '" aria-hidden="true"></i>' +
                '<div class="weather-temp">' + formatTemp(w.temperature) + '</div>' +
            '</div>' +
            '<div class="weather-place">' + placeName(payload) + '</div>' +
            '<div class="weather-condition">' + w.condition_text + '</div>' +
            '<div class="weather-details">' +
                '<span><i class="fas fa-temperature-low" aria-hidden="true"></i> Feels ' + formatTemp(w.feels_like) + '</span>' +
                '<span><i class="fas fa-tint" aria-hidden="true"></i> ' + (w.humidity != null ? w.humidity + '%' : '--') + '</span>' +
                '<span><i class="fas fa-wind" aria-hidden="true"></i> ' + (w.wind_speed != null ? Math.round(w.wind_speed) + 'km/h' : '--') + '</span>' +
            '</div>' +
            '<div class="weather-hilo"><span>H: ' + formatTemp(w.high) + '</span><span>L: ' + formatTemp(w.low) + '</span></div>' +
            renderDaily(w.daily) +
            '<div class="weather-source">' + (payload.source === 'gps' ? 'Based on your device location' : 'Based on your approximate (IP) location') + '</div>';

        updateLocateButton(payload);
    }

    function updateLocateButton(payload) {
        var btn = document.getElementById('weather-locate-btn');
        if (!btn) return;
        if (payload.source === 'gps') {
            var loc = payload.location || {};
            var label = [loc.city, loc.region].filter(Boolean).join(', ') || 'Current location';
            btn.innerHTML = '<i class="fas fa-location-dot" aria-hidden="true"></i><span>' + label + '</span>';
            btn.classList.add('located');
            btn.title = 'Refresh precise location';
        } else {
            btn.innerHTML = '<i class="fas fa-location-crosshairs" aria-hidden="true"></i><span>Use my location</span>';
            btn.classList.remove('located');
            btn.title = '';
        }
    }

    function renderError(message) {
        var body = document.getElementById('weather-body');
        if (!body) return;
        body.innerHTML = '<div class="notif-empty"><i class="fas fa-exclamation-circle"></i><span>' + message + '</span></div>';
    }

    function fetchWeather(query) {
        var body = document.getElementById('weather-body');
        if (body) body.innerHTML = '<div class="notif-loading"><i class="fas fa-spinner fa-spin"></i></div>';

        fetch(FORECAST_URL + (query ? '?' + query : ''), { credentials: 'same-origin' })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (data) {
                lastPayload = data;
                renderWeather(data);
            })
            .catch(function (err) {
                console.error('[Seoto] Weather fetch failed:', err && err.message);
                renderError('Could not load weather right now.');
            });
    }

    function useMyLocation() {
        if (!navigator.geolocation) {
            renderError('Precise location is not supported on this browser.');
            return;
        }
        var body = document.getElementById('weather-body');
        if (body) body.innerHTML = '<div class="notif-loading"><i class="fas fa-spinner fa-spin"></i></div>';

        navigator.geolocation.getCurrentPosition(
            function (position) {
                fetchWeather('lat=' + position.coords.latitude + '&lon=' + position.coords.longitude);
            },
            function () {
                renderError('Location permission denied — showing your approximate location instead.');
                if (lastPayload) renderWeather(lastPayload);
            },
            { timeout: 10000, maximumAge: 300000 }
        );
    }

    function openWeatherPanel() {
        var panel   = document.getElementById('weather-panel');
        var overlay = document.getElementById('weather-overlay');
        if (!panel) return;

        if (window.SeotoCloseNotifPanel) window.SeotoCloseNotifPanel();

        panel.classList.add('open');
        panel.setAttribute('aria-hidden', 'false');
        overlay.classList.add('active');
        ['weather-toggle', 'weather-toggle-mobile'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('aria-expanded', 'true');
        });

        if (!lastPayload) fetchWeather();
    }

    function closeWeatherPanel() {
        var panel   = document.getElementById('weather-panel');
        var overlay = document.getElementById('weather-overlay');
        if (!panel) return;
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('active');
        ['weather-toggle', 'weather-toggle-mobile'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('aria-expanded', 'false');
        });
    }

    window.SeotoCloseWeatherPanel = closeWeatherPanel;

    document.addEventListener('DOMContentLoaded', function () {
        ['weather-toggle', 'weather-toggle-mobile'].forEach(function (id) {
            var toggle = document.getElementById(id);
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var panel = document.getElementById('weather-panel');
                    if (panel && panel.classList.contains('open')) {
                        closeWeatherPanel();
                    } else {
                        openWeatherPanel();
                    }
                });
            }
        });

        var closeBtn = document.getElementById('weather-close');
        var overlay  = document.getElementById('weather-overlay');
        if (closeBtn) closeBtn.addEventListener('click', closeWeatherPanel);
        if (overlay)  overlay.addEventListener('click', closeWeatherPanel);

        var locateBtn = document.getElementById('weather-locate-btn');
        if (locateBtn) locateBtn.addEventListener('click', useMyLocation);
    });
})();
</script>
