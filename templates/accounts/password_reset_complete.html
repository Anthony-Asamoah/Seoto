{% extends "base.html" %}

{% block title %}| Password Reset Complete{% endblock %}

{% block style %}
    <style>
        .header {
            text-align: center;
        }

        .main {
            max-width: 600px;
            margin: auto;
            text-align: center;
        }

        .success-message {
            margin: 30px 0;
        }

        .success-icon {
            font-size: 64px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .buttons {
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            width: auto;
            min-width: 150px;
            border-radius: 5px;
            margin: 5px;
            transition: 0.3s ease;
            font-family: "Poppins", sans-serif;
            font-weight: 500;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container">
        <div class="header">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Password Reset Complete</h2>
        </div>
        <div class="main">
            <div class="success-message">
                <p>Your password has been successfully reset.</p>
                <p>You can now log in with your new password.</p>
            </div>
            <div class="buttons">
                <a href="{% url 'login' %}"><button class="btn btn-success">Login Now</button></a>
                <a href="{% url 'index' %}"><button class="btn btn-secondary">Go Home</button></a>
            </div>
        </div>
    </div>
{% endblock %}
