{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Seoto {% block title %}{% endblock %}</title>

    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/logo.ico' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {#    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">#}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            padding: 0 15px;
            transition: 0.1s ease;
        }

        .navbar-brand:hover {
            font-weight: 300;
        }

        .crumb {
            text-decoration: none;
            color: #175a9c;
            transition: 0.3s ease;
        }

        .crumb:hover {
            text-decoration: underline;
            font-weight: 400;
            margin-left: 5px;
        }

        #message {
            text-align: center;
        }

        body {
            margin-bottom: 100px;
        }

        .header {
        {# Window load effects #} transition: .5s ease;
            opacity: 0;
            padding: 0;
        {# End of effects #}
        }

        .main {
        {# Window load effects #} transition: .5s ease;
            opacity: 0;
            padding: 30px;
        {# End of effects #} background-color: whitesmoke;
        }

        .header h1 {
            text-align: center;
        }

        footer {
            position: fixed;
            width: 100%;
            height: 50px;
            bottom: 0;
            left: 0;
            overflow: hidden;
            text-align: center;
            background-color: whitesmoke;
        }

        .footer {
            font-family: monospace;
            margin-top: 12px;
        }

        @media screen and (max-width: 481px) {
            footer {
                font-size: 12px;
                height: 25px;
            }

            .footer {
                margin-top: 4px;
            }

            h1, h2 {
                font-size: 1.5em;
            }

            h3, h4 {
                font-size: 1.3em;
            }

            h5, h6 {
                font-size: 1.2em;
            }
        }
    </style>
    {% block style %}{% endblock %}
</head>
<body>
{% include 'partials/_nav.html' %}
{% include 'partials/_messages.html' %}
{% block content %}{% endblock %}
{% include 'partials/_footer.html' %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@popperjs/core@2"></script>
</body>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Animation function
        function show() {
            let canvas = document.querySelector('.main');
            let head = document.querySelector('.header');

            if (canvas) {
                canvas.style.opacity = '1';
                canvas.style.padding = '20px';
            }
            if (head) {
                head.style.opacity = '1';
                head.style.padding = '5px';
            }
        }

        // Trigger animation after a delay
        setTimeout(show, 250);

        // Optional: Add debug logging for modal (Bootstrap 5 syntax)
        const myModal = document.getElementById('myModal');
        if (myModal) {
            myModal.addEventListener('show.bs.modal', function (event) {
                console.log('Modal is about to show');
            });

            myModal.addEventListener('shown.bs.modal', function (event) {
                console.log('Modal is now visible');
            });
        }
    });
</script>
{% block script %}{% endblock %}

</html>
